name: CI with Pytest Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write # Required to post coverage comments on PRs

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Change to your preferred version
        cache: 'pip'          # Speeds up subsequent workflow runs

    # 3. Install testing and project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Run tests and export Cobertura XML format coverage
    - name: Run tests with pytest
      run: |
        pytest --cov=src/ --cov-report=xml
      # Replace 'src/' with your application directory name

    # 5. Comment the Coverage Report on the Pull Request
    - name: Pytest Coverage Comment
      if: github.event_name == 'pull_request'
      uses: MishaKav/pytest-coverage-comment@main
      with:
        pytest-xml-coverage-path: ./coverage.xml
        title: Code Coverage Report
        badge-title: Coverage
